<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lectolandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2d42; --muted:#6b6f85; --pri:#ff7a59; --pri2:#e8613f; --sec:#3fa7d6; --sec2:#2b88b5;
  --ok:#2bb673; --ok2:#1f9459; --bad:#ef476f; --yel:#ffd166; --card:#ffffff; --pur:#8e6cf0; --pur2:#7151d6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
img,svg{max-width:100%}
body{font-family:'Andika',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 10% 10%,#fff1c9 0,transparent 40%),radial-gradient(circle at 90% 20%,#d9f2ff 0,transparent 45%),linear-gradient(#fff8ec,#eaf7ff);background-attachment:fixed}
h1,h2,h3,.btn,.tab,.badge{font-family:'Baloo 2',sans-serif}
.screen{display:none;max-width:920px;margin:0 auto;padding:16px 16px 40px}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* botones */
.btn{border:none;border-radius:18px;padding:13px 22px;font-size:1.15rem;font-weight:800;cursor:pointer;color:#fff;
  background:var(--pri);box-shadow:0 5px 0 var(--pri2);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri2)}
.btn.blue{background:var(--sec);box-shadow:0 5px 0 var(--sec2)} .btn.blue:active{box-shadow:0 1px 0 var(--sec2)}
.btn.green{background:var(--ok);box-shadow:0 5px 0 var(--ok2)} .btn.green:active{box-shadow:0 1px 0 var(--ok2)}
.btn.purple{background:var(--pur);box-shadow:0 5px 0 var(--pur2)} .btn.purple:active{box-shadow:0 1px 0 var(--pur2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9dbe6}
.btn.small{padding:8px 14px;font-size:1rem;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}

/* bienvenida */
.welcome{text-align:center;padding-top:18px}
.logo{font-size:4.2rem;line-height:1;animation:bounce 2.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome h1{font-size:clamp(2.4rem,9vw,3.6rem);margin:6px 0 0;color:var(--pri);text-shadow:3px 3px 0 #ffe1b0}
.welcome p.sub{font-size:1.2rem;color:var(--muted);margin:4px 0 22px}
.panel{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 10px 30px rgba(43,45,66,.08);max-width:520px;margin:0 auto}
.panel label{display:block;font-weight:700;font-size:1.15rem;margin-bottom:8px}
.panel input{width:100%;font-family:'Andika';font-size:1.4rem;padding:12px 16px;border-radius:16px;border:3px solid #ffe1b0;outline:none;text-align:center}
.panel input:focus{border-color:var(--pri)}
.opt{font-size:.95rem;color:var(--muted);margin-top:6px}
.micstate{margin:18px 0 6px;font-size:1.05rem;padding:10px;border-radius:14px;background:#f3f4f8}
.micstate.ok{background:#dff7ea;color:#137a46}
.micstate.bad{background:#ffe3e9;color:#b3123c}
.welcome .actions{display:flex;flex-direction:column;gap:14px;margin-top:16px}

/* barra superior */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h2{flex:1;margin:0;font-size:clamp(1.3rem,5vw,1.8rem);text-align:center}
.badge{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 #e6e7ef;white-space:nowrap}

/* men\FA  */
.hello{font-size:clamp(1.6rem,6vw,2.2rem);text-align:center;margin:6px 0 4px;font-family:'Baloo 2';font-weight:800}
.hello span{color:var(--pri)}
.menu-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:18px}
.mcard{border:none;border-radius:28px;padding:26px 18px;color:#fff;cursor:pointer;text-align:center;font-family:'Baloo 2';transition:transform .15s}
.mcard:active{transform:scale(.97)}
.mcard .ico{font-size:3.6rem}
.mcard .tt{font-size:2rem;font-weight:800;line-height:1.1}
.mcard .ds{font-size:1.1rem;opacity:.95;font-weight:600}
.mcard.o{background:linear-gradient(135deg,#ff9a76,#ff6b6b);box-shadow:0 8px 0 #d84f4f}
.mcard.c{background:linear-gradient(135deg,#6dc8f3,#8e6cf0);box-shadow:0 8px 0 #6a4fcf}
.bar{height:14px;background:rgba(255,255,255,.35);border-radius:99px;margin:12px auto 4px;max-width:220px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.menu-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}

/* pesta\F1 as niveles */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:0 0 auto;border:none;border-radius:16px;padding:10px 16px;font-size:1.05rem;font-weight:800;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e1e3ec}
.tab.active{background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.item{border:none;background:#fff;border-radius:18px;padding:12px 4px 8px;cursor:pointer;box-shadow:0 4px 0 #e1e3ec;font-family:'Baloo 2';transition:transform .1s}
.item:active{transform:scale(.95)}
.item .n{font-size:1.6rem;font-weight:800;color:var(--sec2)}
.item .st{font-size:.85rem;letter-spacing:-1px;min-height:1.1em}
.item.done{background:#eafbf1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{border:none;background:#fff;border-radius:22px;padding:14px 10px;cursor:pointer;box-shadow:0 5px 0 #e1e3ec;text-align:center;transition:transform .1s}
.scard:active{transform:scale(.96)}
.scard .e{font-size:2.6rem}
.scard .num{font-family:'Baloo 2';color:var(--muted);font-size:.9rem}
.scard .t{font-family:'Baloo 2';font-weight:800;font-size:1.1rem;line-height:1.15;min-height:2.3em}
.scard.done{background:#eafbf1}

/* lector */
.progress-line{text-align:center;color:var(--muted);font-weight:700;margin-bottom:8px}
.reader{background:#fff;border-radius:28px;padding:clamp(18px,4vw,34px) clamp(12px,3vw,26px);box-shadow:0 12px 34px rgba(43,45,66,.1);
  text-align:center;font-size:clamp(1.9rem,6.5vw,3.1rem);line-height:1.7;min-height:170px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 4px;border:4px solid #fff0d4}
.reader.listening{border-color:var(--bad)}
.reader{max-width:100%;overflow:hidden;overflow-wrap:break-word;word-wrap:break-word}
.reader.story{display:block !important;font-size:clamp(1.3rem,4.4vw,2rem);line-height:1.9;text-align:left;hyphens:none;white-space:normal}
.reader.story .w{display:inline;padding:2px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.reader.story br{display:none}
.w{display:inline-block;padding:0 8px;border-radius:12px;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.w.next{box-shadow:inset 0 -5px 0 var(--yel)}
.w.ok{background:#c9f5dd;color:#11703f}
.w.bad{background:#ffd6de;color:#b3123c}
.w.speak{background:var(--yel);transform:scale(1.08)}
.hint{text-align:center;color:var(--muted);font-size:.95rem;margin:8px 0 0}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
.mic{width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;font-size:2.6rem;color:#fff;background:var(--bad);box-shadow:0 6px 0 #c7304f;transition:transform .08s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 #c7304f}
.stopico{display:inline-block;width:34px;height:34px;border-radius:7px;background:#fff;vertical-align:middle}
.mic.on{animation:pulse 1.1s infinite;background:#d62c55}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,71,111,.55),0 6px 0 #c7304f}70%{box-shadow:0 0 0 22px rgba(239,71,111,0),0 6px 0 #c7304f}100%{box-shadow:0 0 0 0 rgba(239,71,111,0),0 6px 0 #c7304f}}
.miclabel{text-align:center;font-family:'Baloo 2';font-weight:800;font-size:1.15rem;min-height:1.6em;color:var(--bad)}
.feedback{display:none;margin:12px auto 0;max-width:620px;background:#fff;border-radius:22px;padding:16px;text-align:center;box-shadow:0 6px 18px rgba(43,45,66,.08)}
.feedback.show{display:block;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.feedback .stars{font-size:2.4rem;letter-spacing:4px}
.feedback .msg{font-family:'Baloo 2';font-weight:800;font-size:1.45rem}
.feedback .heard{color:var(--muted);font-size:.95rem;margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.story-title{text-align:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(1.5rem,5.5vw,2.2rem);margin:0 0 4px}
.dots{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
.dots i{width:14px;height:14px;border-radius:50%;background:#dfe2ec}
.dots i.cur{background:var(--yel);transform:scale(1.25)}
.dots i.done{background:var(--ok)}
.storyfull{background:#fffdf6;border-radius:20px;padding:14px 18px;margin-top:18px;font-size:1.15rem;line-height:1.7;border:2px dashed #ffe1b0}
.storyfull h3{margin:0 0 6px;font-size:1.1rem;color:var(--muted)}
.storyfull p{margin:0}
.storyfull .l{padding:2px 6px;border-radius:8px}
.storyfull .l.cur{background:#fff1c2;font-weight:700}
.storyfull .l.ok{color:#11703f}
.storyfull .l.pend{color:#a3a7ba}
.warn{background:#fff3cd;color:#7a5b00;border-radius:16px;padding:12px;margin:12px auto;max-width:620px;font-size:.98rem;text-align:center}
.confetti{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:99;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.final{display:none;text-align:center;margin-top:16px}
.final.show{display:block;animation:pop .4s ease}
.final .big{font-size:3.4rem}
</style>
</head>
<body>

<!-- ============ BIENVENIDA ============ -->
<section id="sWelcome" class="screen active">
  <div class="welcome">
    <div class="logo">&#x1F4D6;</div>
    <h1>Lectolandia</h1>
    <p class="sub">&#xA1;Leo en voz alta y aprendo jugando!</p>
    <div class="panel">
      <label for="nameInput">&#xBF;C&#xF3;mo te llamas?</label>
      <input id="nameInput" type="text" maxlength="20" placeholder="Escribe tu nombre" autocomplete="off">
      <div class="opt">(Puedes dejarlo vac&#xED;o si quieres)</div>
      <div id="micState" class="micstate">&#x1F3A4; El micr&#xF3;fono a&#xFA;n no est&#xE1; activado</div>
      <div class="actions">
        <button class="btn blue" id="btnMic">&#x1F3A4; Activar micr&#xF3;fono</button>
        <button class="btn" id="btnStart">&#xA1;Empezar a leer! &#x1F680;</button>
      </div>
    </div>
    <div id="envWarn"></div>
    <p style="color:#a3a7ba;font-size:.85rem;margin-top:18px">Versi&#xF3;n 2.4</p>
  </div>
</section>

<!-- ============ MEN&#xDA; ============ -->
<section id="sMenu" class="screen">
  <div class="hello" id="helloTxt">&#xA1;Hola!</div>
  <div style="text-align:center"><span class="badge" id="menuStars">&#x2B50; 0</span></div>
  <div class="menu-cards">
    <button class="mcard o" id="goOraciones">
      <div class="ico">&#x270F;&#xFE0F;</div><div class="tt">Oraciones</div><div class="ds">100 oraciones &#xB7; 4 niveles</div>
      <div class="bar"><i id="barO" style="width:0"></i></div><div class="ds" id="txtO">0 de 100</div>
    </button>
    <button class="mcard c" id="goCuentos">
      <div class="ico">&#x1F4DA;</div><div class="tt">Cuentos</div><div class="ds">50 cuentos cortos</div>
      <div class="bar"><i id="barC" style="width:0"></i></div><div class="ds" id="txtC">0 de 50</div>
    </button>
  </div>
  <div class="menu-foot">
    <button class="btn ghost small" id="btnChangeName">&#x1F464; Cambiar nombre</button>
    <button class="btn ghost small" id="btnReset">&#x1F504; Borrar progreso</button>
  </div>
</section>

<!-- ============ LISTA ORACIONES ============ -->
<section id="sOraciones" class="screen">
  <div class="topbar">
    <button class="btn ghost small" data-back="sMenu">&#x2B05;</button>
    <h2>&#x270F;&#xFE0F; Oraciones</h2>
    <span class="badge" id="oStars">&#x2B50; 0</span>
  </div>
  <div class="tabs" id="levelTabs"></div>
  <div class="grid" id="oGrid"></div>
</section>

<!-- ============ LISTA CUENTOS ============ -->
<section id="sCuentos" class="screen">
  <div class="topbar">
    <button class="btn ghost small" data-back="sMenu">&#x2B05;</button>
    <h2>&#x1F4DA; Cuentos</h2>
    <span class="badge" id="cStars">&#x2B50; 0</span>
  </div>
  <div class="sgrid" id="cGrid"></div>
</section>

<!-- ============ LECTOR ============ -->
<section id="sReader" class="screen">
  <div class="topbar">
    <button class="btn ghost small" id="readerBack">&#x2B05;</button>
    <h2 id="readerHead">Oraci&#xF3;n</h2>
    <span class="badge" id="rStars">&#x2B50; 0</span>
  </div>
  <div id="storyHeader" style="display:none">
    <div class="story-title" id="storyTitle"></div>
    <div class="dots" id="storyDots"></div>
  </div>
  <div class="progress-line" id="progLine"></div>
  <div class="reader" id="readerBox"></div>
  <p class="hint" id="hintTxt">&#x1F446; Toca una palabra para escucharla</p>

  <div class="controls">
    <button class="btn blue" id="btnListen">&#x1F50A; Escuchar</button>
    <button class="mic" id="btnRead" aria-label="Leer en voz alta">&#x1F3A4;</button>
    <button class="btn purple" id="btnRetry" style="display:none">&#x1F501; Otra vez</button>
  </div>
  <div class="miclabel" id="micLabel">Toca el micr&#xF3;fono y lee en voz alta</div>

  <div class="feedback" id="feedback">
    <div class="stars" id="fbStars"></div>
    <div class="msg" id="fbMsg"></div>
    <div class="heard" id="fbHeard"></div>
  </div>

  <div class="final" id="finalBox">
    <div class="big">&#x1F3C6;</div>
    <div class="feedback show" style="display:block">
      <div class="stars" id="finStars"></div>
      <div class="msg" id="finMsg"></div>
    </div>
  </div>

  <div class="navrow">
    <button class="btn ghost" id="btnPrev">&#x2B05; Anterior</button>
    <button class="btn green" id="btnNext">Siguiente &#x27A1;</button>
  </div>

  <div class="storyfull" id="storyFull" style="display:none"><h3>&#x1F4D6; El cuento completo</h3><p id="storyFullTxt"></p></div>
  <div id="readerWarn"></div>
</section>

<script>
/* =====================================================
   CONTENIDO: 100 ORACIONES
===================================================== */
const ORACIONES = [
// Nivel 1 \u2013 cortitas
"Mi mam\u00e1 me ama.","El sol brilla.","Mi perro ladra.","La casa es roja.","Yo como pan.",
"El gato duerme.","Pap\u00e1 lee un libro.","La luna es blanca.","Mi pelota es azul.","El pato nada.",
"Me gusta el mango.","La flor huele rico.","Yo tomo leche.","El \u00e1rbol es alto.","Mi oso es suave.",
"La vaca da leche.","El ni\u00f1o salta.","La ni\u00f1a canta.","Mi abuela cocina.","El pez es dorado.",
"Tengo una mu\u00f1eca.","El cielo es azul.","Mi t\u00edo tiene una moto.","La mesa es de madera.","Yo lavo mis manos.",
// Nivel 2 \u2013 medianas
"El perro corre en el parque.","Mi hermana pinta un dibujo bonito.","La gallina puso un huevo.","Mi pap\u00e1 maneja un carro grande.","Los p\u00e1jaros cantan en la ma\u00f1ana.",
"Me gusta jugar con mis amigos.","La maestra escribe en la pizarra.","El caballo come pasto verde.","Mi mam\u00e1 compra fruta en el mercado.","Hoy vamos a la playa.",
"El conejo come una zanahoria.","Mi abuelo cuida sus plantas.","La mariposa vuela sobre las flores.","Yo guardo mis juguetes en la caja.","El tren pasa por el puente.",
"Mi gata tiene tres gatitos.","La lluvia moja el jard\u00edn.","Mi amigo trae su pelota nueva.","El panadero hace pan caliente.","Los ni\u00f1os juegan en el recreo.",
"Mi hermano duerme en su cama.","La tortuga camina muy lento.","Yo ayudo a mi mam\u00e1 en casa.","El mono come un pl\u00e1tano.","Mi escuela tiene un patio grande.",
// Nivel 3 \u2013 largas
"Todas las ma\u00f1anas desayuno pan con queso y leche.","El agricultor siembra ma\u00edz en su chacra.","Mi familia visita a los abuelos los domingos.","Los peces de colores nadan en la pecera.","El bombero apaga el fuego con mucha agua.",
"Cuando llueve me pongo mis botas amarillas.","La doctora revisa a los ni\u00f1os con cuidado.","Mi perro mueve la cola cuando llego a casa.","En el zool\u00f3gico vimos un le\u00f3n y una jirafa.","La abeja hace miel dulce en su panal.",
"Mis amigos y yo armamos un castillo de arena.","El cartero trae cartas a todas las casas.","Antes de dormir mi mam\u00e1 me lee un cuento.","El burrito carga le\u00f1a por el camino.","Me lavo los dientes despu\u00e9s de cada comida.",
"La se\u00f1ora vende tamales en la esquina.","El avi\u00f3n vuela muy alto sobre las nubes.","En el huerto crecen tomates, lechugas y zanahorias.","Mi hermanita aprende a caminar con cuidado.","Los pescadores salen al mar en sus botes.",
"El arco\u00edris tiene muchos colores bonitos.","Yo riego las plantas de mi jard\u00edn.","La hormiga lleva una hoja a su casa.","Mi pap\u00e1 y yo volamos una cometa.","Los pollitos siguen a su mam\u00e1 gallina.",
// Nivel 4 \u2013 desaf\u00edo
"El ni\u00f1o ley\u00f3 un libro muy interesante sobre los dinosaurios.","Durante el verano mi familia viaja a la playa para descansar.","La maestra nos ense\u00f1\u00f3 a sumar y restar con palitos de colores.","Mi abuela prepara un arroz con pato delicioso para el almuerzo.","Los estudiantes cuidan el planeta separando la basura en tachos.",
"El colibr\u00ed mueve sus alas tan r\u00e1pido que casi no se ven.","En la noche las estrellas brillan en el cielo oscuro.","Mi hermano mayor me ayuda a hacer las tareas de la escuela.","El caballito de paso baila con elegancia en la fiesta del pueblo.","Los ni\u00f1os sembraron un \u00e1rbol en el patio de la escuela.",
"La ara\u00f1a teje su telara\u00f1a con mucha paciencia en la ventana.","Cuando termino mis tareas salgo a jugar con mi bicicleta.","El cocinero prepar\u00f3 una sopa caliente para todos los invitados.","Las ballenas son animales enormes que viven en el oc\u00e9ano.","Mi mam\u00e1 dice que leer todos los d\u00edas nos hace m\u00e1s inteligentes.",
"El viento fuerte movi\u00f3 las ramas de los \u00e1rboles del parque.","Los bomberos son valientes y siempre ayudan a las personas.","En la biblioteca hay muchos libros de cuentos y aventuras.","La luna ilumina el camino de los viajeros durante la noche.","Mi perrito aprendi\u00f3 a sentarse y a dar la pata.",
"Las semillas necesitan agua, tierra y sol para crecer.","Mi pap\u00e1 construy\u00f3 una casita de madera para los p\u00e1jaros.","Los ni\u00f1os respetan las reglas cuando juegan en equipo.","El c\u00f3ndor vuela majestuoso sobre las altas monta\u00f1as de los Andes.","Cada d\u00eda aprendo algo nuevo y me siento muy feliz."
];
const NIVELES = [
  {n:"\ud83c\udf31 Nivel 1", from:0},{n:"\ud83c\udf3f Nivel 2", from:25},{n:"\ud83c\udf33 Nivel 3", from:50},{n:"\ud83c\udfd4\ufe0f Nivel 4", from:75}
];

/* =====================================================
   CONTENIDO: 50 CUENTOS CORTOS
===================================================== */
const CUENTOS = [
{e:"\ud83d\udc31",t:"El gato Michi",p:["Michi es un gato gris.","Le gusta dormir al sol.","Un d\u00eda vio un rat\u00f3n.","Michi corri\u00f3, pero el rat\u00f3n se escondi\u00f3."]},
{e:"\ud83d\udc36",t:"Toby y su pelota",p:["Toby es un perro feliz.","Su pelota es roja.","Un d\u00eda la pelota cay\u00f3 al r\u00edo.","Su amigo el pato se la devolvi\u00f3."]},

/* =====================================================
   ESTADO Y ALMACENAMIENTO
===================================================== */
const KEY = "lectolandia_v1";
let S = { name:"", o:{}, c:{} };
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d) S = Object.assign(S,d); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

const $ = id => document.getElementById(id);
const starsTxt = n => "\u2b50".repeat(n) + "\u2606".repeat(3-n);
const totalStars = () => Object.values(S.o).reduce((a,b)=>a+b,0) + Object.values(S.c).reduce((a,b)=>a+b,0);
const nameOr = (alt="") => S.name ? S.name : alt;

let mode = "o", idx = 0, part = 0, partScores = [], curLevel = 0;

/* =====================================================
   NAVEGACI\u00d3N
===================================================== */
function show(id){
  stopAll();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  updateBadges();
}
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ if(b.dataset.back==="sMenu") renderMenu(); show(b.dataset.back); });

function updateBadges(){
  const t = "\u2b50 " + totalStars();
  ["menuStars","oStars","cStars","rStars"].forEach(i=>$(i).textContent=t);
}

/* =====================================================
   BIENVENIDA + MICR\u00d3FONO
===================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("nameInput").value = S.name || "";

(function envCheck(){
  let msgs = [];
  if(!window.isSecureContext) msgs.push("\u26a0\ufe0f Para usar el micr\u00f3fono, abre esta p\u00e1gina con <b>https://</b> (por ejemplo GitHub Pages o Tiiny.host).");
  if(!SR) msgs.push("\u26a0\ufe0f Este navegador no reconoce la voz. Usa <b>Google Chrome</b> (Android, Windows, Mac) o <b>Safari</b> (iPhone/iPad).");
  if(msgs.length) $("envWarn").innerHTML = '<div class="warn">'+msgs.join("<br>")+'</div>';
})();

async function activarMic(){
  const st = $("micState");
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    st.className="micstate ok"; st.textContent="\u2705 \u00a1Micr\u00f3fono activado! Ya puedes leer";
    return true;
  }catch(e){
    st.className="micstate bad"; st.textContent="\u274c No se pudo activar. Toca el candado \ud83d\udd12 de la barra y permite el micr\u00f3fono.";
    return false;
  }
}
$("btnMic").onclick = activarMic;
if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:"microphone"}).then(p=>{
    if(p.state==="granted"){ $("micState").className="micstate ok"; $("micState").textContent="\u2705 \u00a1Micr\u00f3fono activado! Ya puedes leer"; }
  }).catch(()=>{});
}

$("btnStart").onclick = ()=>{
  S.name = $("nameInput").value.trim().replace(/\s+/g," ");
  S.name = S.name ? S.name.charAt(0).toUpperCase()+S.name.slice(1) : "";
  save();
  // desbloquea la voz en m\u00f3viles
  try{ const u=new SpeechSynthesisUtterance(""); speechSynthesis.speak(u);}catch(e){}
  renderMenu(); show("sMenu");
  speak(S.name ? "\u00a1Hola, "+S.name+"! Vamos a leer juntos." : "\u00a1Hola! Vamos a leer juntos.");
};

   MEN\u00da

function renderMenu(){
  $("helloTxt").innerHTML = S.name ? "\u00a1Hola, <span>"+escapeH(S.name)+"</span>! \ud83d\udc4b" : "\u00a1Hola, lector! \ud83d\udc4b";
  const nO = Object.keys(S.o).length, nC = Object.keys(S.c).length;
  $("barO").style.width = (nO/ORACIONES.length*100)+"%"; $("txtO").textContent = nO+" de "+ORACIONES.length+" le\u00eddas";
  $("barC").style.width = (nC/CUENTOS.length*100)+"%"; $("txtC").textContent = nC+" de "+CUENTOS.length+" le\u00eddos";
  updateBadges();
}
$("goOraciones").onclick = ()=>{ renderOraciones(); show("sOraciones"); };
$("goCuentos").onclick = ()=>{ renderCuentos(); show("sCuentos"); };
$("btnChangeName").onclick = ()=>{ $("nameInput").value=S.name; show("sWelcome"); };
$("btnReset").onclick = ()=>{ if(confirm("\u00bfBorrar todas las estrellas y empezar de nuevo?")){ S.o={}; S.c={}; save(); renderMenu(); } };

/* =====================================================
   LISTAS
===================================================== */
function renderOraciones(){
  const tabs = $("levelTabs"); tabs.innerHTML="";
  NIVELES.forEach((lv,i)=>{
    const b=document.createElement("button"); b.className="tab"+(i===curLevel?" active":""); b.textContent=lv.n;
    b.onclick=()=>{curLevel=i;renderOraciones();}; tabs.appendChild(b);
  });
  const g=$("oGrid"); g.innerHTML="";
  const from=NIVELES[curLevel].from;
  for(let i=from;i<from+25;i++){
    const st=S.o[i];
    const b=document.createElement("button"); b.className="item"+(st!==undefined?" done":"");
    b.innerHTML='<div class="n">'+(i+1)+'</div><div class="st">'+(st!==undefined?starsTxt(st):"")+'</div>';
    b.onclick=()=>openOracion(i); g.appendChild(b);
  }
}
function renderCuentos(){
  const g=$("cGrid"); g.innerHTML="";
  CUENTOS.forEach((c,i)=>{
    const st=S.c[i];
    const b=document.createElement("button"); b.className="scard"+(st!==undefined?" done":"");
    b.innerHTML='<div class="e">'+c.e+'</div><div class="num">Cuento '+(i+1)+'</div><div class="t">'+c.t+'</div><div class="st">'+(st!==undefined?starsTxt(st):"&nbsp;")+'</div>';
    b.onclick=()=>openCuento(i); g.appendChild(b);
  });
}

/* =====================================================
   LECTOR
===================================================== */
let words = [];   // {el, norm, start}
let curText = "";

function openOracion(i){
  mode="o"; idx=i; $("btnNext").onclick=nextHandler;
  $("readerHead").textContent="\u270f\ufe0f Oraci\u00f3n "+(i+1);
  $("storyHeader").style.display="none"; $("storyFull").style.display="none";
  $("progLine").textContent = NIVELES[Math.floor(i/25)].n + " \u00b7 " + ((i%25)+1) + " de 25";
  $("btnPrev").disabled = i===0;
  $("btnNext").textContent = i===ORACIONES.length-1 ? "Terminar \u2705" : "Siguiente \u27a1";
  $("finalBox").classList.remove("show");
  setText(ORACIONES[i]);
  show("sReader");
}
function openCuento(i){
  mode="c"; idx=i; $("btnNext").onclick=nextHandler;
  $("readerHead").textContent="\ud83d\udcda Cuento "+(i+1);
  $("storyHeader").style.display="block"; $("storyFull").style.display="none";
  $("storyDots").style.display="none";
  $("storyTitle").textContent = CUENTOS[i].e+" "+CUENTOS[i].t;
  $("finalBox").classList.remove("show");
  $("progLine").textContent = "Lee todo el cuento en voz alta \ud83d\udcd6";
  $("btnPrev").disabled = i===0;
  $("btnNext").textContent = i===CUENTOS.length-1 ? "Terminar \u2705" : "Siguiente cuento \u27a1";
  setText(CUENTOS[i].p.join(" ").replace(/\s+/g," ").trim());
  show("sReader");
}
function setText(text){
  stopAll();
  curText=text; words=[];
  const box=$("readerBox"); box.innerHTML=""; box.classList.remove("listening"); box.classList.toggle("story",mode==="c");
  const re=/\S+/g; let m;
  while((m=re.exec(text))){
    const sp=document.createElement("span"); sp.className="w"; sp.textContent=m[0];
    const n=norm(m[0]);
    const w={el:sp, norm:n, start:m.index, raw:m[0]};
    sp.onclick=()=>{ if(!listening) speakWord(w); };
    box.appendChild(sp); box.appendChild(document.createTextNode(" ")); words.push(w);
  }
  $("feedback").classList.remove("show");
  $("btnRetry").style.display="none";
  $("micLabel").textContent = "Toca el micr\u00f3fono \ud83c\udfa4 y lee en voz alta";
  markNext([]);
  updateBadges();
}

$("readerBack").onclick=()=>{
  if(mode==="o"){ renderOraciones(); show("sOraciones"); } else { renderCuentos(); show("sCuentos"); }
};
$("btnPrev").onclick=()=>{
  if(mode==="o"){ if(idx>0) openOracion(idx-1); }
  else if(idx>0){ openCuento(idx-1); }
};
$("btnNext").onclick=()=>{
  if(mode==="o"){
    if(idx<ORACIONES.length-1){ curLevel=Math.floor((idx+1)/25); openOracion(idx+1); }
    else { renderMenu(); show("sMenu"); }
  } else {
    if(idx<CUENTOS.length-1) openCuento(idx+1);
    else { renderCuentos(); show("sCuentos"); }
  }
};
$("btnRetry").onclick=()=>{ setText(curText); startListening(); };
$("btnListen").onclick=()=>{ if(!listening) speakSentence(); };
$("btnRead").onclick=()=>{ listening ? stopListening() : startListening(); };

const nextHandler = $("btnNext").onclick;

/* =====================================================
   VOZ (LECTURA EN VOZ ALTA)
===================================================== */
let esVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const pref=["es-PE","es-US","es-MX","es-419","es-ES"];
  for(const p of pref){ const v=vs.find(x=>x.lang&&x.lang.replace("_","-").toLowerCase()===p.toLowerCase()); if(v){esVoice=v;return;} }
  esVoice=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith("es"))||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

function speak(text, opts={}){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="es-ES"; if(esVoice){u.voice=esVoice;u.lang=esVoice.lang;}
  u.rate=opts.rate||0.85; u.pitch=1.1;
  if(opts.onboundary) u.onboundary=opts.onboundary;
  if(opts.onend) u.onend=opts.onend;
  speechSynthesis.speak(u);
}
function speakSentence(){
  clearSpeak();
  speak(curText,{rate:0.75,
    onboundary:e=>{
      if(e.name && e.name!=="word") return;
      clearSpeak();
      let w=null; for(const x of words){ if(x.start<=e.charIndex) w=x; }
      if(w) w.el.classList.add("speak");
    },
    onend:clearSpeak});
}
function speakWord(w){
  clearSpeak(); w.el.classList.add("speak");
  speak(w.raw.replace(/[\u00a1!\u00bf?.,;:]/g,""),{rate:0.7,onend:clearSpeak});
}
function clearSpeak(){ words.forEach(w=>w.el.classList.remove("speak")); }

/* =====================================================
   RECONOCIMIENTO DE VOZ
===================================================== */
const NUMS={"0":"cero","1":"uno","2":"dos","3":"tres","4":"cuatro","5":"cinco","6":"seis","7":"siete","8":"ocho","9":"nueve","10":"diez","100":"cien"};
function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\s]/g," ").trim();
}
function spokenWords(t){
  return norm(t).split(/\s+/).filter(Boolean).map(w=>NUMS[w]||w);
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function sim(a,b){
  if(a===b) return true;
  // b/v, y/ll, s/z/c suenan igual en Per\u00fa
  const f=x=>x.replace(/v/g,"b").replace(/ll/g,"y").replace(/z/g,"s").replace(/c([ei])/g,"s$1").replace(/h/g,"");
  if(f(a)===f(b)) return true;
  if(a.length>=4 && lev(a,b)<=1) return true;
  if(a.length>=8 && lev(a,b)<=2) return true;
  return false;
}
function align(target, spoken){
  const n=target.length, m=spoken.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]= sim(target[i],spoken[j]) ? 1+dp[i+1][j+1] : Math.max(dp[i+1][j],dp[i][j+1]);
  const res=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){
    if(sim(target[i],spoken[j]) && dp[i][j]===1+dp[i+1][j+1]){res[i]=true;i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++;
  }
  return res;
}
function targetList(){ return words.filter(w=>w.norm).map(w=>({w, t:w.norm.split(" ")[0]})); }

const IS_ANDROID=/android/i.test(navigator.userAgent);
/* Une dos textos sin repetir palabras: si el final de "a" coincide con el
   inicio de "b" (Android env\u00eda frases acumuladas: "Michi", "Michi es un"...),
   solo se agrega la parte nueva. */
function mergeText(a,b){
  const A=(a||"").trim().split(/\s+/).filter(Boolean);
  const B=(b||"").trim().split(/\s+/).filter(Boolean);
  if(!A.length) return B.join(" ");
  if(!B.length) return A.join(" ");
  const na=A.map(norm), nb=B.map(norm);
  // b ya est\u00e1 contenido al final de a
  const sa=na.join(" "), sb=nb.join(" ");
  if((" "+sa).endsWith(" "+sb)) return A.join(" ");
  // a est\u00e1 contenido al inicio de b (frase acumulada)
  if((sb+" ").startsWith(sa+" ")) return B.join(" ");
  let k=Math.min(na.length,nb.length);
  for(;k>0;k--){
    let ok=true;
    for(let i=0;i<k;i++){ if(na[na.length-k+i]!==nb[i]){ok=false;break;} }
    if(ok) break;
  }
  return A.concat(B.slice(k)).join(" ");
}
let accum="", rec=null, listening=false, finalized=true, transcript="", gotSpeech=false, silenceT=null, maxT=null, recLang="es-PE";

function startListening(){
  if(!SR){ showReaderWarn("Este navegador no puede escuchar. Usa Google Chrome o Safari."); return; }
  if(!window.isSecureContext){ showReaderWarn("El micr\u00f3fono necesita que la p\u00e1gina se abra con https://"); return; }
  if(listening) return;
  if("speechSynthesis" in window) speechSynthesis.cancel();
  clearSpeak();
  words.forEach(w=>w.el.classList.remove("ok","bad"));
  $("feedback").classList.remove("show"); $("btnRetry").style.display="none";
  markNext([]);

  transcript=""; accum=""; gotSpeech=false; finalized=false;
  if(!beginRec()) return;
  listening=true; setMicUI(true);
  resetSilence(9000); // tiempo para empezar a hablar
  clearTimeout(maxT); maxT=setTimeout(()=>finish(), 8000 + words.length*1300);
}
// Crea una sesi\u00f3n de reconocimiento. En textos largos (cuentos) el navegador
// a veces se detiene solo; entonces se reinicia y se suma lo ya le\u00eddo.
function beginRec(){
  const r=new SR(); rec=r;
  // En Android el modo continuo repite frases; all\u00ed se escucha por tramos y se reinicia solo
  rec.lang=recLang; rec.interimResults=true; rec.continuous=!IS_ANDROID; rec.maxAlternatives=1;

  rec.onresult=e=>{
    if(r!==rec || finalized) return;
    let t="";
    for(let i=0;i<e.results.length;i++) t=mergeText(t, e.results[i][0].transcript);
    transcript=mergeText(accum, t); gotSpeech=true;
    const matched=liveMark();
    if(matched.every(Boolean)){ finish(); return; }
    resetSilence(mode==="c" ? 3800 : 2300);
  };
  rec.onerror=e=>{
    if(r!==rec) return;
    if(e.error==="language-not-supported" && recLang!=="es-ES"){
      recLang="es-ES"; setTimeout(()=>{ if(!finalized) beginRec(); },100); return;
    }
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      showReaderWarn("\ud83d\udd12 El micr\u00f3fono est\u00e1 bloqueado. Toca el candado de la barra de direcciones y permite el micr\u00f3fono.");
    }
  };
  rec.onend=()=>{
    if(r!==rec || finalized) return;
    accum=transcript;               // guarda lo le\u00eddo y sigue escuchando
    setTimeout(()=>{ if(!finalized && r===rec && !beginRec()) finish(); },60);
  };
  try{ rec.start(); return true; }catch(err){ return false; }
}
function resetSilence(ms){ clearTimeout(silenceT); silenceT=setTimeout(()=>finish(), ms); }
function stopListening(){ finish(); }
function stopAll(){
  if(rec){ finalized=true; try{rec.abort();}catch(e){} }
  listening=false; setMicUI(false);
  clearTimeout(silenceT); clearTimeout(maxT);
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function setMicUI(on){
  $("btnRead").classList.toggle("on",on);
  $("btnRead").innerHTML = on ? '<span class="stopico"></span>' : "\ud83c\udfa4";
  $("readerBox").classList.toggle("listening",on);
  $("btnListen").disabled = on;
  if(on) $("micLabel").textContent="\ud83d\udc42 Te estoy escuchando... \u00a1lee en voz alta!";
}
function liveMark(){
  const tl=targetList();
  const matched=align(tl.map(x=>x.t), spokenWords(transcript));
  tl.forEach((x,k)=>x.w.el.classList.toggle("ok",matched[k]));
  markNext(matched);
  return matched;
}
function markNext(matched){
  const tl=targetList();
  tl.forEach(x=>x.w.el.classList.remove("next"));
  let last=-1; matched.forEach((v,k)=>{ if(v) last=k; });
  const nx=tl[last+1]; if(nx && !finalized) nx.w.el.classList.add("next");
}

function finish(){
  if(finalized && !listening) return;
  finalized=true;
  clearTimeout(silenceT); clearTimeout(maxT);
  try{ rec.stop(); }catch(e){}
  listening=false; setMicUI(false);
  evaluate();
}

function evaluate(){
  const tl=targetList();
  tl.forEach(x=>x.w.el.classList.remove("next"));
  if(!gotSpeech || !transcript.trim()){
    $("micLabel").textContent="\ud83d\ude49 No te escuch\u00e9. Toca el micr\u00f3fono y lee m\u00e1s fuerte.";
    $("btnRetry").style.display="none";
    return;
  }
  const matched=align(tl.map(x=>x.t), spokenWords(transcript));
  tl.forEach((x,k)=>{ x.w.el.classList.toggle("ok",matched[k]); x.w.el.classList.toggle("bad",!matched[k]); });
  const pct=matched.filter(Boolean).length/tl.length;
  const st = pct>=0.9?3 : pct>=0.7?2 : pct>=0.4?1 : 0;
  const nm = S.name ? ", "+S.name : "";

  let msg, say;
  if(st===3){ msg="\u00a1Excelente"+nm+"! Le\u00edste muy bien \ud83c\udf89"; say="\u00a1Excelente"+nm+"! Le\u00edste muy bien."; }
  else if(st===2){ msg="\u00a1Muy bien"+nm+"! Casi perfecto \ud83d\udc4f"; say="\u00a1Muy bien"+nm+"! Casi perfecto. Revisa las palabras en rojo."; }
  else if(st===1){ msg="\u00a1Buen intento"+nm+"! Practica las palabras en rojo \ud83d\udcaa"; say="Buen intento"+nm+". Escucha y vuelve a intentarlo."; }
  else { msg="\u00a1T\u00fa puedes"+nm+"! Escucha primero y vuelve a leer \ud83d\udd0a"; say="T\u00fa puedes"+nm+". Escucha primero y vuelve a leer."; }

  $("fbStars").textContent=starsTxt(st);
  $("fbMsg").textContent=msg;
  $("fbHeard").textContent="Escuch\u00e9: \u201c"+transcript.trim()+"\u201d";
  $("feedback").classList.add("show");
  $("btnRetry").style.display="inline-flex";
  $("micLabel").textContent = st>=2 ? (mode==="c" ? "\u00a1Cuento terminado! Toca Siguiente cuento \u27a1" : "\u00a1Sigue as\u00ed! Toca Siguiente \u27a1") : "Toca una palabra roja para escucharla";

  if(mode==="o"){
    if(S.o[idx]===undefined || st>S.o[idx]) S.o[idx]=st;
  } else {
    if(S.c[idx]===undefined || st>S.c[idx]) S.c[idx]=st;
  }
  save(); updateBadges();
  if(st===3) confetti();
  setTimeout(()=>speak(say),250);
}

function showReaderWarn(t){
  $("readerWarn").innerHTML='<div class="warn">'+t+'</div>';
  setTimeout(()=>{$("readerWarn").innerHTML="";},7000);
}

/* =====================================================
   UTILIDADES
===================================================== */
function escapeH(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function confetti(){
  const em=["\u2b50","\ud83c\udf89","\ud83c\udf1f","\ud83c\udf88","\u2728","\ud83d\udc9b"];
  for(let i=0;i<22;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.textContent=em[Math.floor(Math.random()*em.length)];
    d.style.left=Math.random()*100+"vw";
    d.style.animationDuration=(1.8+Math.random()*1.6)+"s";
    d.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),4200);
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopAll(); });
